# Compila y prueba las apps en cada push. iOS solo puede compilarse en macOS: por eso va en la nube.
name: build

on:
  push:
  pull_request:

# El token del CI solo lee el repo: ningún paso escribe en él (los artefactos no lo necesitan)
permissions:
  contents: read

# Un push nuevo a la misma rama cancela el anterior, salvo en master
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Las reglas que se comprueban solas (scripts/reglas.mjs): primero, que fallan en segundos
      - run: node scripts/reglas.mjs --probar && node scripts/reglas.mjs
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # La clave fija de las versiones de prueba; sin el secreto (forks) se firma con la de depuración del runner
      - name: Clave de firma
        env: { KEYSTORE_B64: "${{ secrets.BRIVEL_KEYSTORE_B64 }}" }
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/brivel.jks"
          echo "BRIVEL_KEYSTORE=$RUNNER_TEMP/brivel.jks" >> "$GITHUB_ENV"
      - env: { BRIVEL_KEYSTORE_PASSWORD: "${{ secrets.BRIVEL_KEYSTORE_PASSWORD }}" }
        run: ./gradlew :shared:compileCommonMainKotlinMetadata :shared:jvmTest :shared:jsNodeTest :shared:jsBrowserProductionLibraryDistribution :androidApp:testDebugUnitTest :androidApp:assembleDebug --console=plain
      - run: npm ci && npm run build  # la versión web, con el núcleo recién compilado
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run e2e  # la web construida, en un navegador
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-navegador
          path: web/playwright-report
      # Capturas de todas las pantallas a 320, 375, 768 y 1280 px con su informe (web/e2e/verificar.spec.ts)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verificacion-web
          path: web/verificacion
      # El núcleo en JavaScript y la web ya construida: para probar la web en local sin Java y para los tests de navegador
      - uses: actions/upload-artifact@v7
        with:
          name: nucleo-js
          path: shared/build/dist/js/productionLibrary
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - uses: actions/upload-artifact@v7
        with:
          name: brivel-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - run: brew install xcodegen
      - working-directory: iosApp
        run: |
          xcodegen
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=$(cat ../VERSION).${{ github.run_number }}
          # Grabar con el GPS: sin estas dos claves en el Info.plist final, iOS no da la ubicación (o cierra la app)
          PLIST=build/Build/Products/Debug-iphonesimulator/Brivel.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q location
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$PLIST"
          # La versión visible es 0.<menor>.<compilación>, como en Android y la web
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | grep -qx "$(cat ../VERSION).${{ github.run_number }}"
      # Capturas en el simulador para revisar la interfaz de iOS sin un Mac
      - working-directory: iosApp
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Brivel.app
          xcrun simctl launch "$DEVICE" app.brivel
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/inicio.png
          # Con un perfil y un objetivo de prueba (datos sintéticos): cada pestaña
          xcrun simctl terminate "$DEVICE" app.brivel
          DATA='{"profile":{"birthYear":1990,"level":"intermediate","strength":"gym","cardio":["walking","running"],"days":{"MON":45,"WED":45,"FRI":45,"SAT":60}},"goal":{"kind":"FITNESS","since":"2026-01-05"},"blockStart":"2026-01-05"}'
          xcrun simctl spawn "$DEVICE" defaults write app.brivel brivel.data -string "$DATA"
          for mode in dark light; do
            xcrun simctl ui "$DEVICE" appearance $mode
            for t in 0 1 2 3 4; do
              xcrun simctl launch "$DEVICE" app.brivel -tab $t
              sleep 6
              xcrun simctl io "$DEVICE" screenshot screenshots/pestana-$t-$mode.png
              xcrun simctl terminate "$DEVICE" app.brivel
            done
            # La sesión de fuerza más reciente, abierta
            xcrun simctl launch "$DEVICE" app.brivel -strength auto
            sleep 6
            xcrun simctl io "$DEVICE" screenshot screenshots/fuerza-$mode.png
            xcrun simctl terminate "$DEVICE" app.brivel
          done
          # Tamaños: todos los anchos de iPhone e iPad con iOS 26 (375, 402 y 440 puntos; iPad mini y Pro 13) y, en el más
          # estrecho, el texto del sistema de normal a accesibilidad máxima. Cada pantalla dos veces (a los 7 y a los 15 s):
          # si la primera sale en blanco y la segunda no, es lentitud; si salen las dos en blanco, la app se cuelga
          shoot() {  # dispositivo, nombre, argumentos de lanzamiento
            local dev=$1 name=$2; shift 2
            xcrun simctl launch "$dev" app.brivel "$@"
            sleep 7
            xcrun simctl io "$dev" screenshot "screenshots/$name.png"
            sleep 8
            xcrun simctl io "$dev" screenshot "screenshots/$name-15s.png"
            xcrun simctl terminate "$dev" app.brivel
          }
          sizes() {  # dispositivo, prefijo
            shoot "$1" "$2-hoy" -tab 0
            shoot "$1" "$2-plan" -tab 1 -plan YES
            shoot "$1" "$2-progreso" -tab 3
            shoot "$1" "$2-perfil" -tab 4
            shoot "$1" "$2-perfil-fuerza" -tab 4 -scrollTo fuerza
            shoot "$1" "$2-ajustes" -tab 4 -settings YES
            shoot "$1" "$2-fuerza" -tab 0 -strength auto
          }
          device() {  # nombre (prefijo) del modelo: su simulador, creado si el sistema no trae uno
            local udid
            udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('$1')), ''))")
            if [ -z "$udid" ]; then
              local type runtime
              type=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next((t['identifier'] for t in json.load(sys.stdin)['devicetypes'] if t['name'].startswith('$1')), ''))")
              runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; print([r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']][-1])")
              [ -n "$type" ] && udid=$(xcrun simctl create "$1" "$type" "$runtime" 2>/dev/null || true)
            fi
            echo "$udid"
          }
          xcrun simctl ui "$DEVICE" appearance light
          sizes "$DEVICE" "402"
          xcrun simctl shutdown "$DEVICE"
          for kind in "iPhone SE" "iPhone 17 Pro Max" "iPad mini" "iPad Pro 13"; do
            OTHER=$(device "$kind")
            [ -z "$OTHER" ] && { echo "Sin simulador $kind"; continue; }
            NAME=$(echo "$kind" | tr ' A-Z' '-a-z')
            xcrun simctl boot "$OTHER"
            xcrun simctl bootstatus "$OTHER" -b
            xcrun simctl install "$OTHER" build/Build/Products/Debug-iphonesimulator/Brivel.app
            xcrun simctl spawn "$OTHER" defaults write app.brivel brivel.data -string "$DATA"
            xcrun simctl ui "$OTHER" appearance light
            sizes "$OTHER" "$NAME"
            if [ "$kind" = "iPhone SE" ]; then
              for size in extra-extra-extra-large accessibility-large accessibility-extra-extra-extra-large; do
                xcrun simctl ui "$OTHER" content_size $size
                sizes "$OTHER" "$NAME-texto-$size"
              done
            fi
            xcrun simctl shutdown "$OTHER"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: iosApp/screenshots/
      # .ipa para iPhone real sin cuenta de desarrollador: lo firma SideStore, AltStore o similar. La firma ad hoc solo
      # lleva los permisos (HealthKit) para que el firmador los pida; sin ella la app llegaría sin Apple Salud.
      - working-directory: iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphoneos -configuration Release -derivedDataPath build \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=$(cat ../VERSION).${{ github.run_number }}
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brivel.app Payload/
          codesign -f -s - --entitlements iosApp/iosApp.entitlements Payload/Brivel.app
          codesign -d --entitlements - Payload/Brivel.app
          zip -qry Brivel.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: brivel-ipa
          path: iosApp/Brivel.ipa

  # Cuánto del núcleo ejecutan los tests de la JVM: el informe queda como artefacto y el resumen, en el registro
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:koverLogJvm :shared:koverXmlReportJvm :shared:koverHtmlReportJvm :shared:koverVerifyJvm --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: shared/build/reports/kover

  # La API de la bóveda contra `wrangler dev` con una base de datos local nueva
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - run: mkdir -p ../web/dist && npm ci && npm test

  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "fastapi>=0.111" "uvicorn[standard]>=0.30" "httpx>=0.27" "sqlalchemy>=2.0" "pyjwt>=2.8" "cryptography>=42" "pytest>=8"
      - run: python -m pytest -q
